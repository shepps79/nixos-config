# Starter Hyprland config. Stowed to ~/.config/hypr/hyprland.conf.
# Noctalia provides the bar/launcher/notifications; this file is just the
# compositor: autostart, input, keybinds. Reload with `hyprctl reload`.

# --- Autostart -------------------------------------------------------------
exec-once = systemctl --user start hyprpolkitagent
exec-once = swww-daemon
exec-once = noctalia-shell

# --- Input (match plasma.nix: South African layout) ------------------------
input {
    kb_layout = za
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Look and feel ---------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

# --- Keybinds --------------------------------------------------------------
$mod = SUPER
$term = kitty

bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, Space, exec, fuzzel
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Move/resize with the mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
